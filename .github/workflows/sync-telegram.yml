name: 🔄 Telegram Auto Sync

on:
  schedule:
    # 1. الفترة الصباحية العادية (10:00 ص إلى 3:00 م بتوقيت الأردن) - كل 30 دقيقة
    - cron: '0,30 7-11 * * *'
    # 2. فترة الذروة المسائية (3:00 م إلى 6:00 م بتوقيت الأردن) - كل 15 دقيقة
    - cron: '*/15 12-14 * * *'
    # 3. الفترة المسائية والليلية (6:00 م إلى 1:00 ص بتوقيت الأردن) - كل 30 دقيقة
    - cron: '0,30 15-21 * * *'
  # تشغيل يدوي عند الحاجة من GitHub
  workflow_dispatch:

jobs:
  sync:
    name: Sync Telegram Channel → Database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 تثبيت المكتبات
        run: npm ci

      - name: 🔧 توليد Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🔍 فحص مسار Prisma
        run: ls src/generated/prisma/ | head -5

      - name: 📦 تثبيت tsx للتشغيل
        run: npm install -g tsx

      - name: 🔄 تشغيل المزامنة مع التيليجرام
        run: tsx src/scripts/telegram-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_SYNC_BOT_TOKEN: ${{ secrets.TELEGRAM_SYNC_BOT_TOKEN || '8584452230:AAGRdOL8RDhZZQQPzd55VzLJwYIVnHxMiUY' }}
          TELEGRAM_SYNC_CHAT_ID: ${{ secrets.TELEGRAM_SYNC_CHAT_ID || '1965859902' }}
