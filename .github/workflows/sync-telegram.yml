name: 🔄 Telegram Auto Sync

on:
  schedule:
    # كل نص ساعة
    - cron: '*/30 * * * *'
  # تشغيل يدوي عند الحاجة من GitHub
  workflow_dispatch:

jobs:
  sync:
    name: Sync Telegram Channel → Database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 تثبيت المكتبات
        run: npm ci

      - name: 🔧 توليد Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🔍 فحص مسار Prisma
        run: ls src/generated/prisma/ | head -5

      - name: 📦 تثبيت tsx للتشغيل
        run: npm install -g tsx

      - name: 🔄 تشغيل المزامنة مع التيليجرام
        run: tsx src/scripts/telegram-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
